<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#1b2433">
<title>Angela (test world)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@400;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<canvas id="game"></canvas>
<div id="inp"></div>
<div id="hud">
  <div class="tl">
    <div class="chip px"><i class="dot"></i><span id="onlineN">87</span> online</div>
  </div>
  <div class="tr">
    <div id="menu"></div>
  </div>
  <div id="hint"></div>
  <div id="chatlog"></div>
  <form id="chatbar" class="px hidden" autocomplete="off"><input id="chatin" maxlength="80" placeholder="Say something..." enterkeyhint="send"><button type="submit" class="btn small">Send</button></form>
  <div id="reveal" data-act="x"></div>
  <div id="banner"></div>
  <div id="toasts"></div>
  <div id="mini" class="hidden"><div class="mbox px"><div id="mtitle"></div><div id="mbody"></div><div id="mhint"></div></div></div>
  <button id="act" class="px" aria-label="Action"><div class="bar"><i id="actbar"></i></div></button>
  <div id="joy"><div id="knob"></div></div>
</div>
<div id="modal" class="hidden"></div>
<div id="fade"></div>
<div id="loading"><div class="ld px">Setting up camp...</div></div>
<script src="js/data.js"></script>
<script src="js/art.js"></script>
<script src="js/actmeta.js"></script>
<script src="js/assets.js"></script>
<script src="js/tiles.js"></script>
<script src="js/world.js"></script>
<script src="js/fx.js"></script>
<script src="js/ui.js"></script>
<script src="js/ui2.js"></script>
<script src="js/mini.js"></script>
<script src="js/config.js"></script>
<script src="js/net.js"></script>
<script src="js/chat.js"></script>
<script src="js/game.js"></script>
<script src="js/editor.js"></script>
</body>
</html>
